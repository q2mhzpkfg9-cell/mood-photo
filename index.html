<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ムードフォト</title>
<meta name="description" content="写真を入れるだけで、おしゃれな雰囲気に。フィルター・イラスト風の線画・切り抜き・フレーム・文字入れができる無料の写真加工アプリ。写真は端末の中だけで処理されます。">
<meta name="theme-color" content="#141312">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&family=Klee+One:wght@600&family=Shippori+Mincho:wght@600&family=Yomogi&family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141312; --panel:#1d1b19; --panel2:#262320; --line:#34302c;
  --ink:#f1ece4; --sub:#a39b90; --accent:#e8b48a; --accent-ink:#1b1410;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:26px;letter-spacing:.02em;line-height:1}
.logo small{font-family:"Zen Kaku Gothic New";font-style:normal;font-size:11px;color:var(--sub);margin-left:8px;letter-spacing:.1em}
header .sp{flex:1}
.btn{padding:9px 14px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:default}
main{display:grid;grid-template-columns:1fr 360px;min-height:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:16px 16px 64px;min-height:0;min-width:0}
#view{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.45);touch-action:none;display:none}
#view.pan{cursor:grab}
.stage-tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:8px}
.stage-tools .btn{background:rgba(29,27,25,.85);backdrop-filter:blur(8px);-webkit-user-select:none;user-select:none}
.drop{width:min(520px,100%);aspect-ratio:4/5;max-height:100%;border:1.5px dashed var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:.2s}
.drop.over{border-color:var(--accent);background:rgba(232,180,138,.06)}
.drop h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:44px;font-weight:600}
.drop p{color:var(--sub);font-size:14px;line-height:1.8}
.drop .btn{font-size:15px;padding:13px 26px}
.drop .note{font-size:12px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;padding:14px 8px;font-size:13px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
.pane{display:none;padding:16px;overflow-y:auto;flex:1}
.pane.on{display:block}
aside.off .pane,aside.off .tabs{opacity:.35;pointer-events:none}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preset{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.preset canvas{width:100%;aspect-ratio:1;border-radius:10px;display:block;outline:2px solid transparent;outline-offset:2px;background:var(--panel2)}
.preset.on{color:var(--ink);font-weight:700}
.preset.on canvas{outline-color:var(--accent)}
.row{margin-top:18px}
.lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.lab span:last-child{color:var(--sub);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);margin-top:-8.5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;background:var(--panel2);font-size:13px;border:1px solid transparent}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.h{font-size:12px;color:var(--sub);letter-spacing:.08em;margin:20px 0 10px}
.h:first-child{margin-top:0}
textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;resize:vertical}
.colors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin-top:10px}
.foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.foot .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .stage{padding:8px 16px 56px}
  aside{border-left:none;border-top:1px solid var(--line);height:44dvh;border-radius:18px 18px 0 0}
  .presets{grid-template-columns:repeat(4,1fr);gap:8px}
  .logo small{display:none}
  .drop h1{font-size:36px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Mood Photo<small>ムードフォト</small></div>
    <div class="sp"></div>
    <button class="btn" id="newBtn" hidden>写真をかえる</button>
    <button class="btn primary" id="saveBtn" disabled>保存</button>
  </header>
  <main>
    <section class="stage" id="stage">
      <div class="drop" id="drop">
        <h1>Mood Photo</h1>
        <p>写真を入れるだけで、<br>おしゃれな雰囲気に。</p>
        <button class="btn primary" id="pickBtn">写真をえらぶ</button>
        <p class="note">ドラッグ＆ドロップ・貼り付けもOK<br>写真は端末の中だけで加工され、どこにも送信されません</p>
      </div>
      <canvas id="view"></canvas>
      <div class="stage-tools" id="stageTools">
        <button class="btn" id="cmpBtn">押して比較</button>
        <button class="btn" id="luckyBtn">おまかせ</button>
      </div>
    </section>
    <aside class="off" id="side">
      <nav class="tabs" id="tabs">
        <button data-t="preset" class="on">プリセット</button>
        <button data-t="line">線画</button>
        <button data-t="adjust">調整</button>
        <button data-t="crop">切り抜き</button>
        <button data-t="frame">フレーム</button>
        <button data-t="text">文字</button>
      </nav>
      <div class="pane on" data-p="preset">
        <div class="presets" id="presets"></div>
        <div class="row">
          <div class="lab"><span>かかり具合</span><span id="strengthV">100</span></div>
          <input type="range" id="strength" min="0" max="100" value="100">
        </div>
      </div>
      <div class="pane" data-p="line">
        <div class="h">スタイル</div>
        <div class="chips" id="lines"></div>
        <div class="h">AI</div>
        <label class="check"><input type="checkbox" id="bgOff">背景を消して、人物だけ線画にする</label>
        <div id="lineSliders"></div>
        <p class="hint">写真をイラストのような線画にします。「背景を消す」は端末の中のAIで人物を見つけます（初回だけAIを読み込みます。写真は送信されません）。</p>
      </div>
      <div class="pane" data-p="adjust">
        <div id="sliders"></div>
        <div class="row"><button class="btn" id="resetAdj">調整をリセット</button></div>
      </div>
      <div class="pane" data-p="crop">
        <div class="h">サイズ</div>
        <div class="chips" id="ratios"></div>
        <div class="row">
          <div class="lab"><span>ズーム</span><span id="zoomV">1.0x</span></div>
          <input type="range" id="zoom" min="100" max="300" value="100">
        </div>
        <div class="h">向き</div>
        <div class="chips">
          <button class="chip" id="rotBtn">90° 回転</button>
          <button class="chip" id="flipBtn">左右反転</button>
        </div>
        <p class="hint">切り抜き中は、写真をドラッグして位置を動かせます。</p>
      </div>
      <div class="pane" data-p="frame">
        <div class="chips" id="frames"></div>
      </div>
      <div class="pane" data-p="text">
        <div class="h">文字</div>
        <textarea id="txt" rows="2" placeholder="例）summer memories"></textarea>
        <div class="h">書体</div>
        <div class="chips" id="fonts"></div>
        <div class="h">色</div>
        <div class="colors" id="colors"></div>
        <div class="h">位置</div>
        <div class="chips" id="tpos"></div>
        <div class="row">
          <div class="lab"><span>大きさ</span><span id="tsizeV">6</span></div>
          <input type="range" id="tsize" min="3" max="16" value="6">
        </div>
        <div class="h">日付スタンプ</div>
        <label class="check"><input type="checkbox" id="dateOn">フィルムカメラ風の日付を入れる</label>
        <div class="row"><input type="text" id="dateTxt"></div>
      </div>
      <div class="foot">
        <button class="btn" id="resetAll" disabled>ぜんぶ元に戻す</button>
      </div>
    </aside>
  </main>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);

/* ---------- プリセット ---------- */
// 値はすべて「元の写真からの変化量」。s=影の色かぶり / h=明部の色かぶり [r,g,b]
const PRESETS = [
  {id:'orig',  name:'オリジナル', p:{}},
  {id:'film',  name:'フィルム',   p:{exp:.05,con:-.12,sat:-.15,temp:.12,fade:.08,grain:.35,vig:.25,s:[0,.03,.05],h:[.03,.02,0]}},
  {id:'cafe',  name:'カフェ',     p:{exp:.18,con:-.18,sat:-.22,temp:.08,fade:.06,hl:-.1,h:[.03,.02,0]}},
  {id:'kusumi',name:'くすみ',     p:{exp:.05,con:-.15,sat:-.4,temp:.04,fade:.12,s:[.04,.01,.03]}},
  {id:'clear', name:'透明感',     p:{exp:.2,con:-.06,sat:-.05,temp:-.14,tint:.02,sh:.25,hl:-.15}},
  {id:'pink',  name:'ピンク',     p:{exp:.12,con:-.08,temp:.05,tint:.07,fade:.04,h:[.04,0,.02]}},
  {id:'cine',  name:'シネマ',     p:{con:.18,sat:.05,sh:-.1,vig:.3,s:[-.02,.03,.07],h:[.07,.02,-.04]}},
  {id:'retro', name:'レトロ',     p:{con:-.05,sat:-.12,temp:.28,fade:.12,grain:.5,vig:.35,h:[.05,.04,-.02]}},
  {id:'sunset',name:'夕やけ',     p:{con:.1,sat:.22,temp:.35,tint:.03,vig:.2,h:[.05,.01,-.03]}},
  {id:'summer',name:'なつ',       p:{exp:.06,con:.12,sat:.3,temp:-.06,sh:.15}},
  {id:'mono',  name:'モノクロ',   p:{mono:1,con:.15,fade:.04,grain:.25}},
  {id:'noir',  name:'ノワール',   p:{mono:1,con:.42,exp:-.08,vig:.45,grain:.3}},
];

const SLIDERS = [
  {k:'exp',  name:'明るさ',     min:-100,max:100,f:.8},
  {k:'con',  name:'コントラスト',min:-100,max:100,f:.5},
  {k:'sat',  name:'あざやかさ', min:-100,max:100,f:.8},
  {k:'temp', name:'色温度',     min:-100,max:100,f:.4},
  {k:'tint', name:'色味（緑↔ピンク）',min:-100,max:100,f:.15},
  {k:'hl',   name:'ハイライト', min:-100,max:100,f:.5},
  {k:'sh',   name:'シャドウ',   min:-100,max:100,f:.5},
  {k:'fade', name:'フェード',   min:0,max:100,f:.2},
  {k:'vig',  name:'周辺を暗く', min:0,max:100,f:.7},
  {k:'grain',name:'粒子',       min:0,max:100,f:.6},
];

const RATIOS = [
  {id:'orig',name:'元のまま',v:null},{id:'1:1',name:'正方形',v:1},{id:'4:5',name:'4:5（インスタ）',v:4/5},
  {id:'9:16',name:'9:16（ストーリー）',v:9/16},{id:'3:2',name:'3:2',v:3/2},{id:'16:9',name:'16:9',v:16/9},
];
const FRAMES = [
  {id:'none',name:'なし'},{id:'white',name:'白フチ'},{id:'polaroid',name:'ポラロイド'},
  {id:'soft',name:'ふんわり'},{id:'black',name:'黒フチ'},{id:'film',name:'フィルム'},
];
const FONTS = [
  {f:'Zen Maru Gothic',w:700,name:'まるゴシック'},{f:'Klee One',w:600,name:'てがき'},
  {f:'Shippori Mincho',w:600,name:'明朝'},{f:'Yomogi',w:400,name:'ゆるふわ'},
  {f:'Caveat',w:600,name:'Handwriting'},{f:'Cormorant Garamond',w:600,name:'Classic',italic:true},
];
const COLORS = ['#ffffff','#2b2622','#f3d9b5','#e8a7a0','#a9c4d6','#ff9a3c'];
const LINES = [
  {id:'none',name:'なし'},{id:'pen',name:'ペン画'},{id:'wash',name:'淡彩（うすい色）'},
  {id:'manga',name:'マンガ'},{id:'pencil',name:'えんぴつ'},
];
const LSLIDERS = [
  {k:'lAmt',  name:'線の量'},{k:'lThick',name:'線の太さ'},
  {k:'lDark', name:'黒ベタ（髪など）'},{k:'lColor',name:'色の濃さ（淡彩）'},
];
const TPOS = [{id:'top',name:'上'},{id:'center',name:'まんなか'},{id:'bottom',name:'下'}];

/* ---------- 状態 ---------- */
const S = {
  img:null, fileDate:new Date(), preset:'orig', strength:1, adj:{},
  ratio:'orig', zoom:1, cx:.5, cy:.5, frame:'none',
  text:'', font:0, color:'#ffffff', tpos:'bottom', tsize:6, dateOn:false, dateTxt:'',
  line:'none', bgOff:false, lAmt:50, lThick:40, lDark:35, lColor:50,
  original:false,
};
const resetAdj = () => SLIDERS.forEach(s => S.adj[s.k] = 0);
resetAdj();

function params(){
  const pr = PRESETS.find(p => p.id === S.preset).p, k = S.strength, P = {};
  for (const s of SLIDERS) P[s.k] = (pr[s.k]||0)*k + S.adj[s.k]/100*s.f;
  P.mono = (pr.mono||0)*k;
  P.s = (pr.s||[0,0,0]).map(v => v*k);
  P.h = (pr.h||[0,0,0]).map(v => v*k);
  return P;
}

/* ---------- 画像処理 ---------- */
function hash(x,y){
  let n = Math.imul(x,374761393) + Math.imul(y,668265263);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16))>>>0) / 4294967295;
}
function applyFilter(id, w, h, P, gk){
  const d = id.data;
  // 露出・色温度・色味・コントラストはチャンネルごとのLUTに
  const ex = Math.pow(2, P.exp), c = 1 + P.con;
  const mul = [ex*(1+P.temp*.3), ex*(1+P.temp*.05)*(1-P.tint*.6), ex*(1-P.temp*.3)];
  const lut = mul.map(m => {
    const a = new Float32Array(256);
    for (let i=0;i<256;i++){ let v = Math.min(1, i/255*m); a[i] = (v-.5)*c+.5; }
    return a;
  });
  const [lr,lg,lb] = lut, sat = 1+P.sat, f = P.fade, m = P.mono;
  const [sr,sg,sb] = P.s, [hr,hg,hb] = P.h;
  const hl = P.hl*.6, sh = P.sh*.6, vig = P.vig, gr = P.grain*.28;
  const tone = hl || sh, split = sr||sg||sb||hr||hg||hb;
  let i = 0;
  for (let y=0;y<h;y++){
    const dy = y/h-.5, gy = (y/gk)|0;
    for (let x=0;x<w;x++,i+=4){
      let r = lr[d[i]], g = lg[d[i+1]], b = lb[d[i+2]];
      let l = .299*r+.587*g+.114*b;
      if (tone){
        const lc = Math.min(1,Math.max(0,l));
        const a = sh*(1-lc)*(1-lc) + hl*lc*lc;
        r+=a; g+=a; b+=a; l+=a;
      }
      if (sat !== 1){ r = l+(r-l)*sat; g = l+(g-l)*sat; b = l+(b-l)*sat; }
      if (split){
        const lc = Math.min(1,Math.max(0,l)), il = 1-lc;
        r += sr*il+hr*lc; g += sg*il+hg*lc; b += sb*il+hb*lc;
      }
      if (m){ const L = .299*r+.587*g+.114*b; r += (L-r)*m; g += (L-g)*m; b += (L-b)*m; }
      if (f){ const k = 1-f*1.2; r = f+r*k; g = f+g*k; b = f+b*k; }
      if (vig){
        const dx = x/w-.5, dd = (dx*dx+dy*dy)*2;
        const v = 1 - vig*Math.pow(dd,1.4)*.9;
        r*=v; g*=v; b*=v;
      }
      if (gr){
        const n = (hash((x/gk)|0, gy)-.5)*gr*(1.2-Math.abs(l-.5));
        r+=n; g+=n; b+=n;
      }
      d[i]   = r<=0?0:r>=1?255:r*255;
      d[i+1] = g<=0?0:g>=1?255:g*255;
      d[i+2] = b<=0?0:b>=1?255:b*255;
    }
  }
}

/* ---------- 線画 ---------- */
// ガウスぼかし（ボックスぼかし3回で近似）
function gaussBoxes(sigma){
  const n = 3, wi = Math.sqrt(12*sigma*sigma/n+1);
  let wl = Math.floor(wi); if (wl%2===0) wl--;
  const m = Math.round((12*sigma*sigma - n*wl*wl - 4*n*wl - 3*n)/(-4*wl-4));
  return [0,1,2].map(i => ((i<m?wl:wl+2)-1)/2);
}
function boxPass(s, t, w, h, r, vert){
  if (r<1){ t.set(s); return; }
  const inv = 1/(2*r+1), N = vert?h:w, M = vert?w:h, st = vert?w:1, ln = vert?1:w;
  for (let j=0;j<M;j++){
    const o = j*ln; let acc = 0;
    for (let k=-r-1;k<r;k++) acc += s[o+Math.min(N-1,Math.max(0,k))*st];
    for (let i=0;i<N;i++){
      acc += s[o+Math.min(N-1,i+r)*st] - s[o+Math.max(0,i-r-1)*st];
      t[o+i*st] = acc*inv;
    }
  }
}
function blurF(src, w, h, sigma){
  const a = new Float32Array(src), b = new Float32Array(src.length);
  for (const r of gaussBoxes(Math.max(.3,sigma))){ boxPass(a,b,w,h,r,false); boxPass(b,a,w,h,r,true); }
  return a;
}
const smooth = (a,b,v) => { const t = Math.min(1,Math.max(0,(v-a)/(b-a))); return t*t*(3-2*t); };

function lineArt(id, w, h, mask){
  const d = id.data, n = w*h, u = Math.max(w,h)/1000, st = S.line;
  // 明るさ（1%〜99%で伸ばして、暗い写真・明るい写真の差をならす）
  const gray = new Float32Array(n), hist = new Uint32Array(256);
  for (let i=0,j=0;i<n;i++,j+=4){ const v = (.299*d[j]+.587*d[j+1]+.114*d[j+2])|0; gray[i] = v; hist[v]++; }
  let lo = 0, hi = 255, acc = 0;
  for (let v=0;v<256;v++){ acc += hist[v]; if (acc < n*.01) lo = v; if (acc <= n*.99) hi = v; }
  const span = Math.max(30, hi-lo);
  for (let i=0;i<n;i++) gray[i] = Math.min(1, Math.max(0, (gray[i]-lo)/span));

  const sig = (.5 + S.lThick/100*2.2)*u;
  const pre = blurF(gray, w, h, u*.8);           // 細かいノイズを先に消す
  const g1 = blurF(pre, w, h, sig), g2 = blurF(pre, w, h, sig*1.7);
  const gs = blurF(gray, w, h, u*2.5);           // 黒ベタ・トーン用のなめらかな明るさ
  // 周りのコントラストで線の強さをならす（顔の輪郭など淡い線を拾い、服のしわは出すぎない）
  const sq = new Float32Array(n); for (let i=0;i<n;i++) sq[i] = pre[i]*pre[i];
  const m1 = blurF(pre, w, h, u*12), m2 = blurF(sq, w, h, u*12);
  const t = .05 - S.lAmt/100*.044;               // 線の出やすさ
  const dk = S.lDark/100*.42;                    // この明るさより暗いところを塗りつぶす

  // 人物の輪郭線（マスクの境目）
  const mb = mask ? blurF(mask, w, h, sig*1.3 + u) : null;
  let col = null;
  if (st==='wash'){
    col = [0,1,2].map(c => { const a = new Float32Array(n); for (let i=0;i<n;i++) a[i] = d[i*4+c]/255; return blurF(a,w,h,u*3); });
  }
  const paper = st==='pencil' ? [.97,.955,.93] : [.985,.98,.97];
  const ink = st==='pencil' ? [.22,.21,.2] : [.07,.065,.06];
  const ca = S.lColor/100;
  const per = Math.max(3, 5*u), cs = Math.SQRT1_2;   // マンガのトーン（45°の網点）

  for (let y=0,i=0;y<h;y++){
    for (let x=0;x<w;x++,i++){
      const sd = Math.sqrt(Math.max(0, m2[i]-m1[i]*m1[i]));
      const e = (g2[i]-g1[i]) * Math.min(3, .22/(sd+.05)); // 暗い側の輪郭でプラスになる
      let k = smooth(t, t*1.9+.004, e);
      if (st==='pencil'){
        k = smooth(t*.5, t*2.4+.01, e)*.85;
        k = Math.max(k, smooth(.62, .25, gs[i])*.28);           // 暗いところにうすい影
        k *= .8 + .4*hash(x, (y/3)|0);                          // 紙の目
      }
      if (dk>0) k = Math.max(k, smooth(dk, dk-.07, gs[i]));
      const pm = mask ? smooth(.3, .7, mask[i]) : 1;   // 人物らしさ（背景は0）
      if (st==='manga' && gs[i] < dk+.3){
        const dark = smooth(dk+.3, dk+.02, gs[i]);
        const X = (x+y)*cs/per, Y = (x-y)*cs/per;
        const fx = X-Math.floor(X)-.5, fy = Y-Math.floor(Y)-.5;
        const rr = Math.sqrt(dark)*.42;
        k = Math.max(k, smooth(rr*rr+.012, rr*rr-.012, fx*fx+fy*fy));
      }
      if (mask){
        k *= pm;
        const ol = smooth(.55, .9, 1-Math.abs(mb[i]-.5)*2.2);
        k = Math.max(k, ol*(st==='pencil'?.75:.95));
      }
      let r = paper[0], g = paper[1], b = paper[2];
      if (col && pm>0){
        // 色を少しだけ鮮やかに → 白に寄せて、淡い水彩っぽく
        let cr = col[0][i], cg = col[1][i], cb = col[2][i];
        const l = .299*cr+.587*cg+.114*cb;
        cr = l+(cr-l)*1.5; cg = l+(cg-l)*1.5; cb = l+(cb-l)*1.5;
        const a = ca*.75*(.55+.45*smooth(.15,.6,l))*pm;
        r = paper[0]-(paper[0]-cr)*a; g = paper[1]-(paper[1]-cg)*a; b = paper[2]-(paper[2]-cb)*a;
      }
      const j = i*4;
      d[j]   = Math.min(255,Math.max(0,(r+(ink[0]-r)*k)*255));
      d[j+1] = Math.min(255,Math.max(0,(g+(ink[1]-g)*k)*255));
      d[j+2] = Math.min(255,Math.max(0,(b+(ink[2]-b)*k)*255));
    }
  }
}
/* 人物の切り抜き（MediaPipe・端末内で実行） */
let segmenter = null, segLoading = null, segMask = null; // segMask = {img, canvas}
async function loadSegmenter(){
  if (segmenter) return segmenter;
  if (!segLoading) segLoading = (async () => {
    const V = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opt = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite', delegate:d},
      runningMode:'IMAGE', outputConfidenceMasks:true, outputCategoryMask:false});
    try { segmenter = await V.ImageSegmenter.createFromOptions(fs, opt('GPU')); }
    catch(e){ segmenter = await V.ImageSegmenter.createFromOptions(fs, opt('CPU')); }
    return segmenter;
  })().catch(e => { segLoading = null; throw e; });
  return segLoading;
}
async function ensureMask(){
  if (segMask && segMask.img===S.img) return;
  const seg = await loadSegmenter();
  const img = S.img, sc = Math.min(1, 1024/Math.max(img.width,img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const res = seg.segment(c), m = res.confidenceMasks[0];
  const f = m.getAsFloat32Array(), mw = m.width, mh = m.height;
  const mc = document.createElement('canvas'); mc.width = mw; mc.height = mh;
  const mx = mc.getContext('2d'), md = mx.createImageData(mw, mh);
  for (let i=0;i<f.length;i++){ const v = f[i]*255; md.data[i*4]=md.data[i*4+1]=md.data[i*4+2]=v; md.data[i*4+3]=255; }
  mx.putImageData(md,0,0);
  res.close && res.close();
  segMask = {img, canvas:mc};
}
function cropMask(r, pw, ph){
  if (!S.bgOff || !segMask || segMask.img!==S.img) return null;
  const mc = segMask.canvas, kx = mc.width/r.iw, ky = mc.height/r.ih;
  const c = document.createElement('canvas'); c.width = pw; c.height = ph;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
  x.drawImage(mc, r.sx*kx, r.sy*ky, r.sw*kx, r.sh*ky, 0, 0, pw, ph);
  const d = x.getImageData(0,0,pw,ph).data, a = new Float32Array(pw*ph);
  for (let i=0;i<a.length;i++) a[i] = d[i*4]/255;
  return a;
}

let lineCache = null;
function lineArtCached(x, r, pw, ph){
  const mask = cropMask(r, pw, ph);
  const key = [r.sx,r.sy,r.sw,r.sh,pw,ph,S.line,S.lAmt,S.lThick,S.lDark,S.lColor,!!mask].join('|');
  if (lineCache && lineCache.img===S.img && lineCache.key===key) return lineCache.id;
  const id = x.getImageData(0,0,pw,ph);
  lineArt(id, pw, ph, mask);
  lineCache = {img:S.img, key, id};
  return id;
}

let meta = null; // 直近のプレビューの切り抜き情報（ドラッグ用）
function cropRect(){
  const iw = S.img.width, ih = S.img.height, ar = RATIOS.find(r => r.id === S.ratio).v;
  let sw = iw, sh = ih;
  if (ar){ if (iw/ih > ar){ sw = ih*ar; } else { sh = iw/ar; } }
  sw /= S.zoom; sh /= S.zoom;
  return {sx:(iw-sw)*S.cx, sy:(ih-sh)*S.cy, sw, sh, iw, ih};
}

function render(maxSide){
  if (S.line!=='none') maxSide = Math.min(maxSide, 2400); // 線画は重いので上限
  const r = cropRect();
  const sc = Math.min(1, maxSide/Math.max(r.sw, r.sh));
  const pw = Math.max(1,Math.round(r.sw*sc)), ph = Math.max(1,Math.round(r.sh*sc));
  const pc = document.createElement('canvas'); pc.width = pw; pc.height = ph;
  const x = pc.getContext('2d', {willReadFrequently:true});
  x.imageSmoothingQuality = 'high';
  x.drawImage(S.img, r.sx, r.sy, r.sw, r.sh, 0, 0, pw, ph);
  if (!S.original && S.line!=='none') x.putImageData(lineArtCached(x, r, pw, ph), 0, 0);
  if (!S.original && (S.preset!=='orig' || SLIDERS.some(s => S.adj[s.k]))){
    const id = x.getImageData(0,0,pw,ph);
    applyFilter(id, pw, ph, params(), Math.max(1, Math.round(Math.max(pw,ph)/1000)));
    x.putImageData(id,0,0);
  }
  return {canvas:compose(pc), r, pw};
}

function rrect(x,X,Y,W,H,R){
  x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R);
  x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath();
}

function compose(pc){
  const W = pc.width, H = pc.height, u = Math.max(W,H);
  let L=0,T=0,R=0,B=0,bg=null,rad=0;
  switch (S.frame){
    case 'white':    L=T=R=B=Math.round(u*.04); bg='#ffffff'; break;
    case 'polaroid': L=T=R=Math.round(W*.06); B=Math.round(W*.24); bg='#fbf9f4'; break;
    case 'soft':     L=T=R=B=Math.round(u*.07); bg='#efe8de'; rad=u*.035; break;
    case 'black':    L=T=R=B=Math.round(u*.04); bg='#111111'; break;
    case 'film':     L=R=Math.round(u*.025); T=B=Math.round(u*.09); bg='#0e0d0c'; break;
  }
  const c = document.createElement('canvas'); c.width = W+L+R; c.height = H+T+B;
  const x = c.getContext('2d');
  if (bg){ x.fillStyle = bg; x.fillRect(0,0,c.width,c.height); }
  if (rad){
    x.save(); x.shadowColor='rgba(60,40,20,.25)'; x.shadowBlur=u*.03; x.shadowOffsetY=u*.01;
    rrect(x,L,T,W,H,rad); x.fillStyle='#000'; x.fill(); x.restore();
    x.save(); rrect(x,L,T,W,H,rad); x.clip(); x.drawImage(pc,L,T); x.restore();
  } else x.drawImage(pc,L,T);
  if (S.frame==='film'){
    const hh = T*.3, hw = hh*1.35, gap = hw*1.25;
    x.fillStyle = '#e9e3d6';
    for (let X = gap/2; X < c.width; X += hw+gap){
      rrect(x,X,(T-hh)/2,hw,hh,hh*.2); x.fill();
      rrect(x,X,T+H+(B-hh)/2,hw,hh,hh*.2); x.fill();
    }
  }
  drawText(x, L, T, W, H, B);
  return c;
}

function drawText(x, L, T, W, H, B){
  const t = S.text.trim();
  if (t){
    const F = FONTS[S.font], size = W*S.tsize/100;
    x.font = `${F.italic?'italic ':''}${F.w} ${size}px "${F.f}"`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    const lines = t.split('\n'), lh = size*1.3, total = lh*lines.length;
    const inMargin = S.frame==='polaroid' && S.tpos==='bottom';
    let cy;
    if (inMargin) cy = T+H+B/2;
    else if (S.tpos==='top') cy = T+H*.08+total/2;
    else if (S.tpos==='center') cy = T+H/2;
    else cy = T+H*.92-total/2;
    let col = S.color;
    if (inMargin && col==='#ffffff') col = '#3a3530';
    x.save();
    x.fillStyle = col;
    if (!inMargin){ x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=size*.25; x.shadowOffsetY=size*.04; }
    lines.forEach((ln,i) => x.fillText(ln, L+W/2, cy-total/2+lh*(i+.5)));
    x.restore();
  }
  if (S.dateOn && S.dateTxt.trim()){
    const size = Math.min(W,H)*.055;
    x.save();
    x.font = `700 ${size}px "Courier New", Courier, monospace`;
    x.textAlign = 'right'; x.textBaseline = 'alphabetic';
    x.fillStyle = '#ff9a3c'; x.shadowColor = '#ff5a00'; x.shadowBlur = size*.35;
    x.fillText(S.dateTxt.trim(), L+W-W*.05, T+H-H*.05);
    x.restore();
  }
}

const view = $('#view');
let queued = false;
function draw(){
  if (!S.img || queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const out = render(Math.min(1600, Math.round(1100*(window.devicePixelRatio>1?1.4:1))));

    view.width = out.canvas.width; view.height = out.canvas.height;
    view.getContext('2d').drawImage(out.canvas,0,0);

function makeThumbs(){
  const box = $('#presets'); box.innerHTML = '';
  const n = 150, src = document.createElement('canvas'); src.width = src.height = n;
  const iw = S.img.width, ih = S.img.height, m = Math.min(iw,ih);
  src.getContext('2d').drawImage(S.img,(iw-m)/2,(ih-m)/2,m,m,0,0,n,n);
  const base = src.getContext('2d').getImageData(0,0,n,n);
  for (const pr of PRESETS){
    const b = document.createElement('button'); b.className = 'preset'+(pr.id===S.preset?' on':'');
    const c = document.createElement('canvas'); c.width = c.height = n;
    const id = new ImageData(new Uint8ClampedArray(base.data), n, n);
    if (pr.id!=='orig'){
      const P = {}; for (const s of SLIDERS) P[s.k] = pr.p[s.k]||0;
      P.mono = pr.p.mono||0; P.s = pr.p.s||[0,0,0]; P.h = pr.p.h||[0,0,0];
      applyFilter(id,n,n,P,1);
    }
    c.getContext('2d').putImageData(id,0,0);
    b.append(c, pr.name);
    b.onclick = () => { S.preset = pr.id; syncPresets(); draw(); };
    box.append(b);
  }
}

async function loadFile(file){
  if (!file || !file.type.startsWith('image/')) return toast('画像ファイルを選んでください');
  let src;
  try { src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    src = await new Promise((ok,ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = URL.createObjectURL(file); })
      .catch(() => null);
  }
  if (!src) return toast('この画像は読み込めませんでした');
  // 大きすぎる写真は長辺4096pxに
  const sc = Math.min(1, 4096/Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width*sc); c.height = Math.round(src.height*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  S.img = c; S.cx = S.cy = .5;
  S.fileDate = new Date(file.lastModified || Date.now());
  S.dateTxt = fmtDate(S.fileDate); $('#dateTxt').value = S.dateTxt;
  $('#drop').style.display = 'none'; view.style.display = 'block';
  $('#stageTools').style.display = 'flex';
  $('#side').classList.remove('off');
  $('#saveBtn').disabled = false; $('#resetAll').disabled = false; $('#newBtn').hidden = false;
  makeThumbs(); draw(); refreshMask();
}
function refreshMask(){
  if (S.bgOff) ensureMask().then(draw).catch(() => {});
}
function fmtDate(d){
  const p = n => String(n).padStart(2,'0');
  return `'${p(d.getFullYear()%100)} ${p(d.getMonth()+1)} ${p(d.getDate())}`;
}

stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {

  if (it) loadFile(it.getAsFile());
});

function transform(rot){
  const s = S.img, c = document.createElement('canvas');
  c.width = rot ? s.height : s.width; c.height = rot ? s.width : s.height;
  const x = c.getContext('2d');
  if (rot){ x.translate(c.width,0); x.rotate(Math.PI/2); } else { x.translate(c.width,0); x.scale(-1,1); }
  x.drawImage(s,0,0); S.img = c; S.cx = S.cy = .5; makeThumbs(); draw(); refreshMask();
}

// 切り抜き位置のドラッグ
let drag = null;
view.addEventListener('pointerdown', e => {
  if (!meta || !(S.ratio!=='orig' || S.zoom>1)) return;
  drag = {x:e.clientX, y:e.clientY, cx:S.cx, cy:S.cy}; view.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', e => {
  if (!drag) return;
  const rect = view.getBoundingClientRect(), r = meta.r;
  const k = (view.width/rect.width) * (r.sw/meta.pw); // 画面1px → 元画像のpx
  const fx = r.iw - r.sw, fy = r.ih - r.sh;
  if (fx > 0) S.cx = Math.min(1, Math.max(0, drag.cx - (e.clientX-drag.x)*k/fx));
  if (fy > 0) S.cy = Math.min(1, Math.max(0, drag.cy - (e.clientY-drag.y)*k/fy));
  draw();
});
['pointerup','pointercancel'].forEach(t => view.addEventListener(t, () => drag = null));

// 比較（押している間だけ元の写真）
const cmp = $('#cmpBtn');
cmp.addEventListener('pointerdown', () => { S.original = true; draw(); });
['pointerup','pointerleave','pointercancel'].forEach(t => cmp.addEventListener(t, () => { if (S.original){ S.original = false; draw(); } }));
cmp.oncontextmenu = e => e.preventDefault();

$('#luckyBtn').onclick = () => {
  const list = PRESETS.filter(p => p.id!=='orig' && p.id!==S.preset);
  S.preset = list[Math.floor(Math.random()*list.length)].id;
  syncPresets(); draw(); toast(PRESETS.find(p => p.id===S.preset).name);
};

$('#resetAll').onclick = () => {
  Object.assign(S, {preset:'orig', strength:1, ratio:'orig', zoom:1, cx:.5, cy:.5, frame:'none', text:'', dateOn:false, line:'none', bgOff:false});
  $('#bgOff').checked = false;
  resetAdj(); buildSliders(); syncPresets();
  $('#strength').value = 100; $('#strengthV').textContent = 100;
  $('#zoom').value = 100; $('#zoomV').textContent = '1.0x';
  $('#txt').value = ''; $('#dateOn').checked = false;
  sync($('#ratios'), RATIOS, 'ratio'); sync($('#frames'), FRAMES, 'frame'); sync($('#lines'), LINES, 'line');
  draw();
};

/* ---------- 保存 ---------- */
$('#saveBtn').onclick = async () => {
  if (!S.img) return;
  toast('保存しています…');
  await new Promise(r => setTimeout(r, 30));
  const c = render(4096).canvas;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const name = `mood_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  const file = new File([blob], name, {type:'image/jpeg'});
  const touch = matchMedia('(pointer:coarse)').matches;
  if (touch && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file]}); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('保存しました');
};

let tt;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1600);
}
window.addEventListener('resize', draw);
</script>
</body>
